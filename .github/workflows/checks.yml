name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests
      - run: python -m py_compile start.py local/server.py local/resize.py
      - run: node --check dist/app.js
      - run: node --check dist/local-engine.js
